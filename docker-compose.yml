services:
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5000/api/v1}
    ports:
      - "80:80"
    depends_on:
      - server

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017/prabhavai?replicaSet=rs0}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai-service:8001}
      CLIENT_URL: ${CLIENT_URL:-http://localhost}
      CLIENT_URLS: ${CLIENT_URLS:-http://localhost,http://127.0.0.1}
    depends_on:
      mongodb:
        condition: service_healthy
      ai-service:
        condition: service_started

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    env_file:
      - ./ai-service/.env

  mongodb:
    image: mongo:7
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --eval 'try { rs.status().ok } catch (error) { rs.initiate({ _id: \"rs0\", members: [{ _id: 0, host: \"mongodb:27017\" }] }) }'"
        ]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mongo-data:
